permissions:
  contents: write
name: Build
on: [push]
# Legacy AVR release: only the standard configurator is built, and releases are
# published to their own velopack channels so that legacy and main installs never
# update into each other.
jobs:
  build-mac:
    if: contains(github.ref, 'tags/v')
    name: Build (macOS)
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Unlock Keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: security unlock-keychain -p $KEYCHAIN_PASSWORD login.keychain
      - name: Build Standard
        run: |
          cd santroller-configurator
          dotnet publish -c Release -r osx-x64 -t:BundleApp -p:PublishSingleFile=true -p:RuntimeIdentifier=osx-x64 -p:UseAppHost=true --self-contained --verbosity normal
      - name: Get Version from Project File
        id: get-version
        shell: bash
        run: |
          cd santroller-configurator
          echo "version=$(~/.dotnet/tools/dotnet-gitversion /output json /showvariable SemVer)" >> $GITHUB_OUTPUT
      - name: Create Velopack Release
        run: |
          cd santroller-configurator
          ~/.dotnet/tools/vpk pack -u SantrollerConfigurator -c legacy-osx -v ${{ steps.get-version.outputs.version }} -p bin/Release/net8.0/osx-x64/publish/SantrollerConfigurator.app --signAppIdentity "guitar-configurator" --signInstallIdentity "guitar-configurator" --noInst --icon Resources/icon.icns
      - name: Copy artifacts
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir $RUN_ID
          cp -rf santroller-configurator/Releases $RUN_ID
          rsync -avPr $RUN_ID actions-runner@192.168.0.79:./artifacts
  build-linux:
    if: contains(github.ref, 'tags/v')
    name: Build (Linux)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Build Standard
        run: |
          cd santroller-configurator
          dotnet publish -c Release -r linux-x64 -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true --self-contained --verbosity normal
      - name: Get Version from Project File
        id: get-version
        shell: bash
        run: |
          cd santroller-configurator
          echo "version=$(dotnet-gitversion /output json /showvariable SemVer)" >> $GITHUB_OUTPUT
      - name: Create Velopack Release
        run: |
          cd santroller-configurator
          vpk download github --repoUrl https://github.com/Santroller/Santroller -c legacy-linux --pre
          vpk pack -u SantrollerConfigurator -c legacy-linux -v ${{ steps.get-version.outputs.version }} -p bin/Release/net8.0/linux-x64/publish --icon Resources/icon.png
      - name: Copy artifacts
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p ~/artifacts/$RUN_ID/Releases
          cp -rf santroller-configurator/Releases/* ~/artifacts/$RUN_ID/Releases
  build-windows:
    if: contains(github.ref, 'tags/v')
    name: Build (Windows)
    runs-on: [self-hosted, windows]
    steps:
      - name: git configure long path
        run: git config --global core.longpaths true
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Build Standard
        run: |
          cd santroller-configurator
          dotnet publish -c Release -r win-x64 -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true --self-contained --verbosity normal
      - name: Get Version from Project File
        id: get-version
        run: |
          "version=$(dotnet-gitversion /output json /showvariable SemVer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Create Velopack Release
        run: |
          cd santroller-configurator
          vpk download github --repoUrl https://github.com/Santroller/Santroller -c legacy-win --pre
          vpk pack -u SantrollerConfigurator -c legacy-win -v ${{ steps.get-version.outputs.version }} -p bin/Release/net8.0/win-x64/publish --icon Resources/icon.ico
      - name: Copy artifacts
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir $Env:RUN_ID
          cp -force -recurse santroller-configurator/Releases $Env:RUN_ID/Releases
          scp -r $Env:RUN_ID actions-runner@192.168.0.79:./artifacts
  release:
    if: contains(github.ref, 'tags/v')
    name: Release Linux Build
    runs-on: [self-hosted, linux]
    needs: [build-linux, release-mac]
    steps:
      - name: Release
        run: |
          cd santroller-configurator
          vpk upload github --repoUrl https://github.com/Santroller/Santroller -c legacy-linux --publish --pre --releaseName "SantrollerConfigurator Legacy ${{ github.ref_name }}" --tag ${{ github.ref_name }} --token ${{ secrets.BINARY_GITHUB_TOKEN }} --merge --timeout 30
  release-mac:
    if: contains(github.ref, 'tags/v')
    name: Release macOS Build
    runs-on: [self-hosted, macos]
    needs: [build-mac]
    steps:
      - name: Release
        run: |
          cd santroller-configurator
          vpk upload github --repoUrl https://github.com/Santroller/Santroller -c legacy-osx --publish --pre --releaseName "SantrollerConfigurator Legacy ${{ github.ref_name }}" --tag ${{ github.ref_name }} --token ${{ secrets.BINARY_GITHUB_TOKEN }} --merge --timeout 30
  release-win:
    if: contains(github.ref, 'tags/v')
    name: Release windows Build
    runs-on: [self-hosted, windows]
    needs: [build-windows, release-mac]
    steps:
      - name: Release
        run: |
          cd santroller-configurator
          vpk upload github --repoUrl https://github.com/Santroller/Santroller -c legacy-win --publish --pre --releaseName "SantrollerConfigurator Legacy ${{ github.ref_name }}" --tag ${{ github.ref_name }} --token ${{ secrets.BINARY_GITHUB_TOKEN }} --merge --timeout 30
  cleanup:
    name: Remove temp files
    runs-on: [self-hosted, linux]
    if: ${{ always() && contains(github.ref, 'tags/v') }}
    needs: [release, release-mac, release-win]
    steps:
      - name: Remove artifacts
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          rm -rf ~/artifacts/legacy_release
          mv ~/artifacts/$RUN_ID ~/artifacts/legacy_release
