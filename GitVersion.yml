# Legacy AVR releases are tagged as v10.1.189-legacy.N. CI builds the tag as a detached head named after the tag ref,
# so match both that and the legacy-avr branch, give them the matching label, and don't take versions from main's tags.
branches:
  legacy:
    regex: ^(refs/)?(heads/)?legacy-avr$|^(refs/)?tags/v
    label: legacy
    increment: Patch
    source-branches: []
    is-release-branch: true
